<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Lifecycle — Yahia Raslan</title>
  <meta name="description" content="Interactive DevOps lifecycle visualization — explore how I build, ship, and operate infrastructure.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #050508; --bg-2: #0c0c14; --bg-card: #12121c;
      --text: #f0f0f3; --text-2: #a1a1aa; --text-3: #63637a;
      --accent: #22d3ee; --accent-2: #a78bfa; --accent-3: #22c55e; --accent-4: #f97316;
      --border: rgba(255,255,255,.07);
      --font: 'Inter', system-ui, sans-serif; --mono: 'JetBrains Mono', monospace;
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    a { color: var(--accent); text-decoration: none; }

    /* NAV */
    .topbar { padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .topbar__logo { font-family: var(--mono); font-weight: 700; font-size: 1.1rem; color: var(--text); }
    .topbar__logo span { color: var(--accent); }
    .topbar__link { color: var(--text-2); font-size: .85rem; }
    .topbar__link:hover { color: var(--accent); }

    /* HERO */
    .hero { text-align: center; padding: 4rem 2rem 2rem; }
    .hero__tag { font-family: var(--mono); font-size: .75rem; color: var(--accent); text-transform: uppercase; letter-spacing: .12em; margin-bottom: .75rem; }
    .hero__title { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: -.02em; margin-bottom: .75rem; }
    .hero__title span { background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero__desc { color: var(--text-2); font-size: 1rem; max-width: 550px; margin: 0 auto; line-height: 1.7; }
</style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="topbar__logo"><span>{</span> YR <span>}</span></a>
    <a href="/" class="topbar__link">← Back to Portfolio</a>
  </div>

  <section class="hero">
    <div class="hero__tag">Interactive Visualization</div>
    <h1 class="hero__title">The DevOps <span>Lifecycle</span></h1>
    <p class="hero__desc">Click on any stage to explore the tools and practices I use to build, ship, and operate production infrastructure.</p>
  </section>

  <!-- Pipeline Visualization -->
  <section class="pipeline" id="pipeline">
    <div class="pipeline__ring">
      <svg class="pipeline__svg" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Animated ring -->
        <circle cx="300" cy="300" r="220" stroke="rgba(255,255,255,.04)" stroke-width="2"/>
        <circle cx="300" cy="300" r="220" stroke="url(#ring-gradient)" stroke-width="2" stroke-dasharray="8 6" class="pipeline__ring-dash"/>
        <!-- Flow arrows -->
        <circle cx="300" cy="300" r="220" stroke="none" fill="none" id="motionPath"/>
        <circle class="flow-dot" r="4" fill="#22d3ee"><animateMotion dur="12s" repeatCount="indefinite"><mpath href="#motionPath"/></animateMotion></circle>
        <circle class="flow-dot" r="4" fill="#a78bfa"><animateMotion dur="12s" repeatCount="indefinite" begin="-3s"><mpath href="#motionPath"/></animateMotion></circle>
        <circle class="flow-dot" r="4" fill="#22c55e"><animateMotion dur="12s" repeatCount="indefinite" begin="-6s"><mpath href="#motionPath"/></animateMotion></circle>
        <circle class="flow-dot" r="4" fill="#f97316"><animateMotion dur="12s" repeatCount="indefinite" begin="-9s"><mpath href="#motionPath"/></animateMotion></circle>
        <defs>
          <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
            <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#22c55e" stop-opacity="0.4"/>
          </linearGradient>
        </defs>
      </svg>

      <!-- Center -->
      <div class="pipeline__center">
        <div class="pipeline__infinity">∞</div>
        <div class="pipeline__center-label">CI/CD</div>
      </div>

      <!-- Stages -->
      <button class="stage" data-stage="plan" style="--angle: 0deg;">
        <div class="stage__icon">📋</div>
        <div class="stage__label">Plan</div>
      </button>
      <button class="stage" data-stage="code" style="--angle: 45deg;">
        <div class="stage__icon">💻</div>
        <div class="stage__label">Code</div>
      </button>
      <button class="stage" data-stage="build" style="--angle: 90deg;">
        <div class="stage__icon">🔨</div>
        <div class="stage__label">Build</div>
      </button>
      <button class="stage" data-stage="test" style="--angle: 135deg;">
        <div class="stage__icon">🧪</div>
        <div class="stage__label">Test</div>
      </button>
      <button class="stage" data-stage="release" style="--angle: 180deg;">
        <div class="stage__icon">🚀</div>
        <div class="stage__label">Release</div>
      </button>
      <button class="stage" data-stage="deploy" style="--angle: 225deg;">
        <div class="stage__icon">☁️</div>
        <div class="stage__label">Deploy</div>
      </button>
      <button class="stage" data-stage="operate" style="--angle: 270deg;">
        <div class="stage__icon">⚙️</div>
        <div class="stage__label">Operate</div>
      </button>
      <button class="stage" data-stage="monitor" style="--angle: 315deg;">
        <div class="stage__icon">📊</div>
        <div class="stage__label">Monitor</div>
      </button>
    </div>

    <!-- Detail Panel -->
    <div class="detail" id="detail">
      <div class="detail__header">
        <h3 class="detail__title" id="detail-title">Select a Stage</h3>
        <button class="detail__close" id="detail-close">✕</button>
      </div>
      <p class="detail__desc" id="detail-desc">Click on any stage in the lifecycle to see the tools and practices I use.</p>
      <div class="detail__tools" id="detail-tools"></div>
    </div>
  </section>

  <!-- Styles -->
  <style>
    /* PIPELINE */
    .pipeline { display: flex; flex-direction: column; align-items: center; padding: 2rem; gap: 3rem; }
    @media(min-width: 900px) { .pipeline { flex-direction: row; justify-content: center; gap: 4rem; padding: 2rem 4rem; } }

    .pipeline__ring { position: relative; width: 500px; height: 500px; flex-shrink: 0; }
    @media(max-width: 560px) { .pipeline__ring { width: 340px; height: 340px; } }

    .pipeline__svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pipeline__ring-dash { animation: rotateDash 30s linear infinite; transform-origin: center; }
    @keyframes rotateDash { to { transform: rotate(360deg); } }

    .pipeline__center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center;
    }
    .pipeline__infinity {
      font-size: 3rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1; animation: pulse 3s ease-in-out infinite;
    }
    .pipeline__center-label { font-family: var(--mono); font-size: .7rem; color: var(--text-3); margin-top: .25rem; letter-spacing: .1em; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

    /* STAGES */
    .stage {
      position: absolute; top: 50%; left: 50%;
      width: 72px; height: 72px;
      margin: -36px 0 0 -36px;
      transform: rotate(var(--angle)) translateY(-170px) rotate(calc(-1 * var(--angle)));
      background: var(--bg-card); border: 1.5px solid var(--border);
      border-radius: 50%; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: all .3s cubic-bezier(.4,0,.2,1);
      z-index: 2;
    }
    @media(max-width: 560px) {
      .stage { width: 56px; height: 56px; margin: -28px 0 0 -28px; transform: rotate(var(--angle)) translateY(-115px) rotate(calc(-1 * var(--angle))); }
      .stage__label { font-size: .55rem; }
      .stage__icon { font-size: 1.1rem; }
    }
    .stage:hover, .stage.active {
      border-color: var(--accent);
      background: rgba(34,211,238,.08);
      transform: rotate(var(--angle)) translateY(-170px) rotate(calc(-1 * var(--angle))) scale(1.15);
      box-shadow: 0 0 30px rgba(34,211,238,.2);
    }
    @media(max-width: 560px) {
      .stage:hover, .stage.active { transform: rotate(var(--angle)) translateY(-115px) rotate(calc(-1 * var(--angle))) scale(1.15); }
    }
    .stage__icon { font-size: 1.4rem; line-height: 1; }
    .stage__label { font-size: .6rem; font-weight: 600; color: var(--text-2); margin-top: .2rem; font-family: var(--mono); }

    /* DETAIL PANEL */
    .detail {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      padding: 2rem; max-width: 400px; width: 100%;
      opacity: 0; transform: translateY(10px);
      transition: all .4s cubic-bezier(.4,0,.2,1);
    }
    .detail.visible { opacity: 1; transform: translateY(0); }
    .detail__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .detail__title { font-size: 1.2rem; font-weight: 700; }
    .detail__close { background: none; border: none; color: var(--text-3); font-size: 1.2rem; cursor: pointer; padding: .25rem; }
    .detail__close:hover { color: var(--text); }
    .detail__desc { color: var(--text-2); font-size: .88rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .detail__tools { display: flex; flex-wrap: wrap; gap: .5rem; }
    .tool-tag {
      font-family: var(--mono); font-size: .72rem; font-weight: 500;
      padding: .35rem .75rem; border-radius: 20px;
      background: rgba(34,211,238,.08); color: var(--accent);
      border: 1px solid rgba(34,211,238,.15);
      animation: fadeInTag .3s ease forwards;
      opacity: 0;
    }
    .tool-tag:nth-child(2) { animation-delay: .05s; }
    .tool-tag:nth-child(3) { animation-delay: .1s; }
    .tool-tag:nth-child(4) { animation-delay: .15s; }
    .tool-tag:nth-child(5) { animation-delay: .2s; }
    .tool-tag:nth-child(6) { animation-delay: .25s; }
    .tool-tag--purple { background: rgba(167,139,250,.08); color: var(--accent-2); border-color: rgba(167,139,250,.15); }
    .tool-tag--green { background: rgba(34,197,94,.08); color: var(--accent-3); border-color: rgba(34,197,94,.15); }
    .tool-tag--orange { background: rgba(249,115,22,.08); color: var(--accent-4); border-color: rgba(249,115,22,.15); }
    @keyframes fadeInTag { to { opacity: 1; } }
  </style>

  <!-- Script -->
  <script>
    const stages = {
      plan: {
        title: '📋 Plan',
        desc: 'Defining infrastructure requirements, capacity planning, and translating business needs into technical architecture. Collaboration with teams to design scalable solutions.',
        tools: [
          { name: 'Jira', color: '' },
          { name: 'Confluence', color: '' },
          { name: 'Draw.io', color: '' },
          { name: 'Architecture Diagrams', color: 'purple' },
          { name: 'Capacity Planning', color: 'green' },
        ]
      },
      code: {
        title: '💻 Code',
        desc: 'Writing Infrastructure as Code, automation scripts, and custom tooling. Everything is version-controlled, peer-reviewed, and follows GitFlow branching strategies.',
        tools: [
          { name: 'Terraform', color: 'purple' },
          { name: 'Pulumi', color: 'purple' },
          { name: 'Go', color: '' },
          { name: 'Python', color: '' },
          { name: 'Bash', color: '' },
          { name: 'Git', color: 'orange' },
        ]
      },
      build: {
        title: '🔨 Build',
        desc: 'Automated build pipelines that compile, package, and containerize applications. Every commit triggers a pipeline that produces immutable artifacts.',
        tools: [
          { name: 'GitLab CI', color: 'orange' },
          { name: 'GitHub Actions', color: '' },
          { name: 'Docker', color: '' },
          { name: 'Kaniko', color: '' },
          { name: 'Helm Charts', color: 'purple' },
          { name: 'OCI Images', color: 'green' },
        ]
      },
      test: {
        title: '🧪 Test',
        desc: 'Automated testing at every level — unit tests, integration tests, security scanning, and infrastructure validation before anything reaches production.',
        tools: [
          { name: 'Trivy', color: 'green' },
          { name: 'OPA/Rego', color: 'green' },
          { name: 'Terratest', color: 'purple' },
          { name: 'SonarQube', color: '' },
          { name: 'SAST/DAST', color: 'orange' },
          { name: 'Policy as Code', color: '' },
        ]
      },
      release: {
        title: '🚀 Release',
        desc: 'GitOps-driven releases with automated promotion through environments. Canary deployments, feature flags, and rollback strategies ensure safe releases.',
        tools: [
          { name: 'ArgoCD', color: 'orange' },
          { name: 'FluxCD', color: '' },
          { name: 'Helm', color: '' },
          { name: 'Kustomize', color: 'purple' },
          { name: 'Semantic Versioning', color: 'green' },
          { name: 'GitOps', color: '' },
        ]
      },
      deploy: {
        title: '☁️ Deploy',
        desc: 'Production deployments to Kubernetes clusters across AWS and GCP. Zero-downtime rolling updates, blue-green deployments, and infrastructure provisioning.',
        tools: [
          { name: 'AWS EKS', color: 'orange' },
          { name: 'GCP GKE', color: '' },
          { name: 'Kubernetes', color: '' },
          { name: 'Terraform', color: 'purple' },
          { name: 'Cert-Manager', color: 'green' },
          { name: 'Ingress/ALB', color: '' },
        ]
      },
      operate: {
        title: '⚙️ Operate',
        desc: 'Day-2 operations — secrets management, auto-scaling, backup strategies, disaster recovery, and maintaining high availability across all services.',
        tools: [
          { name: 'Vault', color: 'purple' },
          { name: 'Keycloak', color: '' },
          { name: 'AWS Secrets Manager', color: 'orange' },
          { name: 'HPA/VPA', color: '' },
          { name: 'Velero', color: 'green' },
          { name: 'Ansible', color: '' },
        ]
      },
      monitor: {
        title: '📊 Monitor',
        desc: 'Full-stack observability with metrics, logs, and traces. Custom dashboards, intelligent alerting, and SLO-driven reliability engineering.',
        tools: [
          { name: 'Prometheus', color: 'orange' },
          { name: 'Grafana', color: 'orange' },
          { name: 'Loki', color: '' },
          { name: 'OpenTelemetry', color: '' },
          { name: 'OpenSearch', color: 'green' },
          { name: 'PagerDuty', color: 'purple' },
        ]
      }
    };

    const detail = document.getElementById('detail');
    const detailTitle = document.getElementById('detail-title');
    const detailDesc = document.getElementById('detail-desc');
    const detailTools = document.getElementById('detail-tools');
    const detailClose = document.getElementById('detail-close');

    document.querySelectorAll('.stage').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.stage;
        const data = stages[key];
        if (!data) return;

        // Remove active from all
        document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');

        // Update detail
        detailTitle.textContent = data.title;
        detailDesc.textContent = data.desc;
        detailTools.innerHTML = data.tools.map(t =>
          `<span class="tool-tag${t.color ? ' tool-tag--' + t.color : ''}">${t.name}</span>`
        ).join('');

        detail.classList.add('visible');
      });
    });

    detailClose.addEventListener('click', () => {
      detail.classList.remove('visible');
      document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
    });

    // Show detail by default on load
    setTimeout(() => {
      document.querySelector('[data-stage="plan"]').click();
    }, 800);
  </script>
</body>
</html>
