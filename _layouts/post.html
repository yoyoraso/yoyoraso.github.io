---
layout: default
---

<article class="post">
  <header class="post__header animate-in">
    <h1 class="post__title">{{ page.title }}</h1>
    <div class="post__meta">
      <span>{{ page.date | date: "%B %d, %Y" }}</span>
      {% if page.author %}<span>by {{ page.author }}</span>{% endif %}
      {% if page.categories %}<span>{{ page.categories | join: " / " }}</span>{% endif %}
    </div>
  </header>
  <div class="post__content animate-in">
    {{ content }}
  </div>
</article>
